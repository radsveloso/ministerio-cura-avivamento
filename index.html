<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ministerio-cura-avivamento/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ministério Cura e Avivamento — Apóstolo Ricardo Costa. Inscrições para eventos, cultos e encontros." />
    <title>Ministério Cura e Avivamento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: {
                950: '#0a0806',
                900: '#13100c',
                800: '#1c1812',
                700: '#2a2419',
                600: '#3d3424',
              },
              gold: {
                100: '#fef3c7',
                200: '#fde68a',
                300: '#fcd34d',
                400: '#fbbf24',
                500: '#d4a548',
                600: '#b8893a',
                700: '#92691f',
                800: '#704d10',
              },
            },
            fontFamily: {
              display: ['Cinzel', 'serif'],
              serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
              sans: ['Manrope', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              'gold-soft': '0 0 0 1px rgba(212,165,72,0.15), 0 8px 32px -8px rgba(212,165,72,0.25)',
              'gold-glow': '0 0 0 1px rgba(212,165,72,0.4), 0 0 40px -8px rgba(212,165,72,0.5)',
            },
            backgroundImage: {
              'gold-gradient': 'linear-gradient(135deg, #fcd34d 0%, #d4a548 45%, #b8893a 100%)',
              'gold-text': 'linear-gradient(180deg, #fef3c7 0%, #d4a548 60%, #92691f 100%)',
              'ink-radial':
                'radial-gradient(ellipse at top, #1c1812 0%, #0a0806 70%)',
            },
          },
        },
      }
    </script>

    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Manrope', system-ui, sans-serif;
        background: radial-gradient(ellipse at top, #1c1812 0%, #0a0806 70%);
        background-attachment: fixed;
        color: #f5f5f4;
        min-height: 100vh;
      }
      .font-display { font-family: 'Cinzel', serif; letter-spacing: 0.06em; }
      .font-serif  { font-family: 'Cormorant Garamond', Georgia, serif; }

      /* Texto dourado refinado */
      .text-gold-grad {
        background: linear-gradient(180deg, #fef3c7 0%, #d4a548 55%, #92691f 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Ornamentos */
      .divider-ornament::before,
      .divider-ornament::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(212,165,72,0.5), transparent);
      }
      .divider-ornament {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      /* Grão sutil para textura */
      .grain::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        z-index: 1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #13100c; }
      ::-webkit-scrollbar-thumb { background: #3d3424; border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: #704d10; }

      /* Inputs sempre legíveis */
      input, select, textarea {
        color-scheme: dark;
      }
      input::placeholder, textarea::placeholder { color: #6b6657; }

      /* Animação de entrada */
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .anim-fade-up { animation: fade-up 0.7s ease-out both; }
      .anim-delay-1 { animation-delay: 0.1s; }
      .anim-delay-2 { animation-delay: 0.25s; }
      .anim-delay-3 { animation-delay: 0.4s; }
      .anim-delay-4 { animation-delay: 0.55s; }

      @keyframes glow-pulse {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 0.9; }
      }
      .glow-pulse { animation: glow-pulse 3s ease-in-out infinite; }
    </style>
  </head>
  <body class="grain">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
